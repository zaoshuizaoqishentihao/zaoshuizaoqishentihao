name: Export CUDA Image
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and save
        run: |
          docker pull nvidia/cuda:12.4.1-cudnn-devel-ubuntu20.04
          docker save nvidia/cuda:12.4.1-cudnn-devel-ubuntu20.04 > cuda-image.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda-image
          path: cuda-image.tar
